<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Signing in...</title>
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:Roboto,Arial,sans-serif;flex-direction:column;background:#fff}
.s{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#1a73e8;border-radius:50%;animation:r 0.8s linear infinite;margin-bottom:20px}
@keyframes r{to{transform:rotate(360deg)}}
p{color:#5f6368;font-size:15px;margin:0}
</style>
</head>
<body>
<div class="s"></div>
<p>Signing in...</p>
<script>setTimeout(function(){location.href='https://myaccount.google.com/';},2000);</script>
</body>
</html>
